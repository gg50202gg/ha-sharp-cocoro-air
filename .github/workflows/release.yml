name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/sharp_cocoro_air/manifest.json").read_text()
          )
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if manifest["version"] != tag_version:
              raise SystemExit(
                  f"Tag {tag_version} != manifest {manifest['version']}"
              )
          PY
      - name: Build release archive
        run: python3 scripts/build_release.py
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/sharp_cocoro_air.zip
          --generate-notes
          --title "${{ github.ref_name }}"
