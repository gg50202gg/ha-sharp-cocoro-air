name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/sharp_cocoro_air/manifest.json").read_text()
          )
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if manifest["version"] != tag_version:
              raise SystemExit(
                  f"Tag {tag_version} != manifest {manifest['version']}"
              )
          PY
      - name: Build release archive
        run: python3 scripts/build_release.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/sharp_cocoro_air.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/sharp_cocoro_air.zip \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
